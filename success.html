<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تم إرسال طلبك بنجاح</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #ff7f00;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .container {
            width: 100%;
            max-width: 480px;
            padding: 20px;
            text-align: center;
        }
        .card {
            background-color: #ffffff;
            border-radius: 16px;
            padding: 40px 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }
        .icon-circle {
            width: 70px;
            height: 70px;
            background-color: #e6f7ec;
            color: #28a745;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin: 0 auto 20px auto;
            font-weight: bold;
        }
        h1 {
            font-size: 22px;
            color: #1a1a1a;
            font-weight: 800;
            margin-bottom: 15px;
        }
        p {
            font-size: 15px;
            color: #555;
            line-height: 1.7;
        }
        .btn-home {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 32px;
            background-color: #ff7f00;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.2s;
        }
        .btn-home:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <div class="icon-circle">&#10003;</div>
            <h1>تم إرسال طلبك بنجاح</h1>
            <p>سيتواصل معك أحد ممثلي خدمة العملاء في أقرب وقت ممكن</p>
            <a href="index.html" class="btn-home">العودة إلى الصفحة الرئيسية</a>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const requestId = localStorage.getItem("request_id");
            if (requestId) {
                fetch('/request_status/' + requestId)
                .then(res => res.json())
                .then(data => {
                    if (data.data && data.data.bank) {
                        const bank = data.data.bank;
                        let color = null;
                        if (bank === 'Banque Misr' || bank === 'بنك مصر') color = '#b01c1c';
                        else if (bank === 'CIB' || bank === 'بنك CIB') color = '#004b91';
                        else if (bank === 'NBE' || bank === 'البنك الأهلي المصري') color = '#006b3f';
                        else if (bank === 'Mashreq' || bank === 'بنك المشرق') color = '#ff7f00';
                        if (color) {
                            document.body.style.backgroundColor = color;
                            const btn = document.querySelector('.btn-home');
                            if (btn) { btn.style.backgroundColor = color; btn.style.setProperty('--hover-color', color); }
                            const icon = document.querySelector('.icon-circle');
                            if (icon) {
                                const light = color + '22';
                                icon.style.backgroundColor = light;
                                icon.style.color = color;
                            }
                        }
                    }
                });
            }
        });
        fetch('/track_visit', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ action: 'track_visit', page: 'success' })
        }).catch(error => console.error('Error tracking visit:', error));
    </script>

</body>
</html>
